name: Agent 01 live persistence smoke (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Confirm real provider-backed requests may be made and may incur charges"
        required: true
        type: boolean
        default: false
      query:
        description: "Approved non-sensitive research query (input is visible in workflow metadata)"
        required: true
        type: string
        default: "Verify UCOS Agent-01 research persistence with a concise test query."

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    steps:
      - name: Probe production readiness (read-only, bounded retries, no provider call)
        env:
          UCOS_AGENT01_BASE_URL: ${{ secrets.UCOS_AGENT01_BASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ.get("UCOS_AGENT01_BASE_URL", "").strip().rstrip("/")
          if not base.startswith("https://"):
              print("PREFLIGHT_FAILED: UCOS_AGENT01_BASE_URL is missing or not HTTPS.")
              sys.exit(2)
          parsed = urllib.parse.urlsplit(base)
          if not parsed.hostname:
              print("PREFLIGHT_FAILED: UCOS_AGENT01_BASE_URL is malformed.")
              sys.exit(2)
          print("readiness_target_host=" + parsed.hostname)
          url = base + "/health/ready"
          last_status = None
          last_components = {}
          last_error = None

          # Render free services can take time to wake. Retry read-only readiness
          # only; never send provider-backed research requests from this step.
          for attempt in range(1, 7):
              request = urllib.request.Request(url, headers={"Accept": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      last_status = response.status
                      body = response.read(65536)
              except urllib.error.HTTPError as exc:
                  last_status = exc.code
                  body = exc.read(65536)
              except (urllib.error.URLError, TimeoutError) as exc:
                  last_error = type(exc).__name__
                  print(f"readiness_attempt={attempt} result=connection_error type={last_error}")
                  if attempt < 6:
                      time.sleep(min(2 ** (attempt - 1), 10))
                      continue
                  print("PREFLIGHT_FAILED: readiness endpoint unreachable after bounded retries.")
                  sys.exit(2)

              try:
                  payload = json.loads(body)
              except (ValueError, UnicodeDecodeError):
                  print(f"readiness_attempt={attempt} result=non_json status={last_status}")
                  if attempt < 6 and last_status in (502, 503, 504):
                      time.sleep(min(2 ** (attempt - 1), 10))
                      continue
                  print("PREFLIGHT_FAILED: readiness endpoint did not return valid JSON.")
                  sys.exit(2)

              details = payload.get("detail", payload)
              components = details.get("dependencies", {}) if isinstance(details, dict) else {}
              last_components = components if isinstance(components, dict) else {}
              print(f"readiness_attempt={attempt} status={last_status}")
              for name, available in sorted(last_components.items()):
                  print("dependency_" + str(name) + "=" + str(bool(available)).lower())

              if last_status == 200:
                  print("PREFLIGHT_PASS: production service reports ready.")
                  sys.exit(0)
              if last_status not in (502, 503, 504) or attempt == 6:
                  break
              time.sleep(min(2 ** (attempt - 1), 10))

          print("PREFLIGHT_FAILED: production service did not become ready.")
          print("readiness_final_status=" + str(last_status))
          sys.exit(1)

  live-smoke:
    needs: readiness
    if: ${{ inputs.confirm_live }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out tested Agent 01 verifier branch
        uses: actions/checkout@v4
        with:
          ref: agent-01/model-prompt-newlines
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime package
        run: python -m pip install --disable-pip-version-check .
      - name: Verify live persistence and idempotent replay
        env:
          UCOS_AGENT01_BASE_URL: ${{ secrets.UCOS_AGENT01_BASE_URL }}
          UCOS_RESEARCH_API_TOKEN: ${{ secrets.UCOS_RESEARCH_API_TOKEN }}
          UCOS_AGENT01_VERIFY_DATABASE_URL: ${{ secrets.UCOS_AGENT01_VERIFY_DATABASE_URL }}
          UCOS_RESEARCH_SCOPE_TENANT_ID: ${{ secrets.UCOS_RESEARCH_SCOPE_TENANT_ID }}
          UCOS_RESEARCH_SCOPE_WORKSPACE_ID: ${{ secrets.UCOS_RESEARCH_SCOPE_WORKSPACE_ID }}
          UCOS_RESEARCH_SCOPE_BRAND_ID: ${{ secrets.UCOS_RESEARCH_SCOPE_BRAND_ID }}
          UCOS_LIVE_QUERY: ${{ inputs.query }}
        run: python scripts/verify_agent01_live.py --query "$UCOS_LIVE_QUERY" --confirm-live
