name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage0-safety:
    name: Stage 0 safety and contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Run P0 safety tests
        run: pytest
      - name: Build container image
        run: docker build -t ucos-core:ci .
